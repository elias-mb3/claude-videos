<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="430" rx="18" fill="#0E1116"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C8796"/></marker>
  </defs>
  <!-- Opus -->
  <rect x="40" y="28" width="1120" height="70" rx="14" fill="#2A1F3D" stroke="#8B6FD6"/>
  <text x="600" y="58" text-anchor="middle" fill="#E9E1FF" font-size="20" font-weight="700">Opus — orquestrador</text>
  <text x="600" y="83" text-anchor="middle" fill="#B9AEDB" font-size="15">conversa com você · lê a transcrição · decide cortes, cor, zooms, gráficos, música · confere a qualidade</text>
  <!-- etapas -->
  <g font-size="15" text-anchor="middle">
    <g fill="#16202B" stroke="#3B4A5C">
      <rect x="40" y="150" width="150" height="96" rx="12"/><rect x="225" y="150" width="150" height="96" rx="12"/>
      <rect x="410" y="150" width="150" height="96" rx="12"/><rect x="595" y="150" width="150" height="96" rx="12"/>
      <rect x="780" y="150" width="175" height="96" rx="12"/><rect x="990" y="150" width="170" height="96" rx="12"/>
    </g>
    <g fill="#E8EAED" font-weight="700">
      <text x="115" y="188">Vídeo bruto</text><text x="300" y="188">Transcrição</text><text x="485" y="188">Cortes</text>
      <text x="670" y="188">Cor + zoom</text><text x="867" y="188">Gráficos</text><text x="1075" y="188">Render final</text>
    </g>
    <g fill="#9AA4B2" font-size="13">
      <text x="115" y="212">celular / câmera</text><text x="115" y="230">rotação detectada</text>
      <text x="300" y="212">Whisper large-v3</text><text x="300" y="230">tempo por palavra</text>
      <text x="485" y="212">pausas automáticas</text><text x="485" y="230">conteúdo: aprovação</text>
      <text x="670" y="212">presets de cor</text><text x="670" y="230">lento / punch-in</text>
      <text x="867" y="212">HyperFrames</text><text x="867" y="230">HTML+GSAP → alpha</text>
      <text x="1075" y="212">legendas + trilha</text><text x="1075" y="230">ducking · loudnorm</text>
    </g>
  </g>
  <g stroke="#7C8796" stroke-width="2" marker-end="url(#a)">
    <line x1="190" y1="198" x2="222" y2="198"/><line x1="375" y1="198" x2="407" y2="198"/><line x1="560" y1="198" x2="592" y2="198"/>
    <line x1="745" y1="198" x2="777" y2="198"/><line x1="955" y1="198" x2="987" y2="198"/>
  </g>
  <!-- aprovações -->
  <g fill="#F5C884" font-size="13" text-anchor="middle" font-weight="700">
    <text x="485" y="268">✔ você aprova</text><text x="670" y="268">✔ você aprova</text><text x="1075" y="268">✔ preview 540p</text>
  </g>
  <!-- subagentes -->
  <rect x="40" y="300" width="545" height="56" rx="12" fill="#13261E" stroke="#3FA27A"/>
  <text x="312" y="324" text-anchor="middle" fill="#CFF5E4" font-size="16" font-weight="700">subagente configurador (Sonnet)</text>
  <text x="312" y="345" text-anchor="middle" fill="#8FCBB2" font-size="13">bin/setup · bin/verificar · repara o ambiente</text>
  <rect x="615" y="300" width="545" height="56" rx="12" fill="#13261E" stroke="#3FA27A"/>
  <text x="887" y="324" text-anchor="middle" fill="#CFF5E4" font-size="16" font-weight="700">subagente executor-render (Sonnet)</text>
  <text x="887" y="345" text-anchor="middle" fill="#8FCBB2" font-size="13">transcrição e renders longos · devolve resumo curto</text>
  <text x="600" y="400" text-anchor="middle" fill="#7C8796" font-size="13">tudo roda em containers Podman · edição sem rede · o vídeo nunca sai da sua máquina</text>
</svg>
